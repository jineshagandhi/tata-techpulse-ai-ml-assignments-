name: Assignment 10 - MLOps Pipeline

# Runs only when Assignment 10 (or this file) changes
on:
  push:
    branches: [main]
    paths:
      - "Assignment-10-MLOps-Workflow-Simulation/**"
      - ".github/workflows/assignment-10-mlops.yml"
  pull_request:
    paths:
      - "Assignment-10-MLOps-Workflow-Simulation/**"
      - ".github/workflows/assignment-10-mlops.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Assignment-10-MLOps-Workflow-Simulation

jobs:
  train-and-test:
    name: Validate, train, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Assignment-10-MLOps-Workflow-Simulation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python -m src.validate_data

      - name: Train, track with MLflow, apply quality gate
        run: python -m src.train

      - name: Run tests
        run: python -m pytest -v

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: Assignment-10-MLOps-Workflow-Simulation/model/

      - name: Upload MLflow tracking data
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            Assignment-10-MLOps-Workflow-Simulation/mlflow.db
            Assignment-10-MLOps-Workflow-Simulation/mlruns/

  docker:
    name: Build and smoke test Docker image
    needs: train-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: Assignment-10-MLOps-Workflow-Simulation/model/

      - name: Build image
        run: docker build -t predictive-maintenance-api:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 predictive-maintenance-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

      - name: Smoke test prediction
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"product_type": "L", "air_temperature": 300, "process_temperature": 310, "rotational_speed": 1300, "torque": 80, "tool_wear": 20}' \
            | tee response.json
          grep -q '"failure":true' response.json

      - name: Stop container
        if: always()
        run: docker rm -f api
